name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time-only secret: the encrypted demo page needs *a* password.
      STATICRYPT_PASSWORD: ci-build-only-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Assert the protected page is not in the search index
        run: node scripts/check-build.mjs
