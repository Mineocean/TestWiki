<!DOCTYPE html>
<html lang="zh-CN" class="staticrypt-html">
<head>
    <meta charset="utf-8" />
    <title>机密文档 | Sage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <script>
        /* Set the theme before first paint (mirrors src/components/ThemeInit.astro). */
        (function () {
            var t = localStorage.getItem('theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        :root {
            color-scheme: light;
            --color-bg: #fff; --color-fg: #171717; --color-muted: #737373;
            --color-border: #e5e5e5; --color-accent: #7c3aed;
            --color-surface: #fafafa; --color-error: #dc2626;
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --color-bg: #0a0a0a; --color-fg: #e5e5e5; --color-muted: #8b8b8b;
            --color-border: #262626; --color-accent: #a78bfa;
            --color-surface: #171717; --color-error: #f87171;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        .hidden { display: none !important; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--color-bg); color: var(--color-fg);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .staticrypt-loading { color: var(--color-muted); font-size: 0.95rem; }
        .staticrypt-page {
            width: 380px; max-width: 90vw; padding: 2rem 1rem;
            box-sizing: border-box; text-align: center;
        }
        .logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 3rem; height: 3rem; border-radius: 0.75rem;
            background: var(--color-accent); color: #fff;
            font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem;
        }
        .staticrypt-form {
            background: var(--color-bg); border: 1px solid var(--color-border);
            border-radius: 0.85rem; padding: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            text-align: center;
        }
        .staticrypt-instructions { color: var(--color-muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
        .staticrypt-password-container { position: relative; width: 100%; margin: 0 0 0.75rem; }
        .staticrypt-form input[type="password"] {
            width: 100%; border: 1px solid var(--color-border); border-radius: 0.65rem;
            background: var(--color-surface); color: var(--color-fg); font-size: 0.95rem;
            padding: 0.75rem 1rem; font-family: inherit; outline: none; transition: border-color 0.15s;
        }
        .staticrypt-form input[type="password"]:focus-visible { border-color: var(--color-accent); }
        .staticrypt-form input[type="password"]::placeholder { color: var(--color-muted); }
        .staticrypt-remember {
            display: flex; align-items: center; gap: 0.5rem;
            color: var(--color-muted); font-size: 0.85rem; margin: 0 0 0.75rem;
        }
        .staticrypt-decrypt-button {
            width: 100%; border: none; border-radius: 0.65rem;
            background: var(--color-accent); color: #fff;
            font-size: 0.9rem; font-weight: 600; padding: 0.75rem;
            cursor: pointer; font-family: inherit; transition: opacity 0.15s;
        }
        .staticrypt-decrypt-button:hover { opacity: 0.9; }
        .staticrypt-error { color: var(--color-error); font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.25em; }

        .theme-btn {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;
            border: 1px solid var(--color-border); background: var(--color-bg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: var(--color-muted); box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 1rem; transition: background 0.15s;
        }
        .theme-btn:hover { background: var(--color-surface); }
    </style>
</head>
<body>
    <div id="staticrypt_loading" class="staticrypt-loading">解密中…</div>

    <div id="staticrypt_content" class="staticrypt-content hidden">
        <div class="staticrypt-page">
            <div class="logo">S</div>
            <div class="staticrypt-form">
                <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

                <form id="staticrypt-form" action="#" method="post">
                    <div class="staticrypt-password-container">
                        <input id="staticrypt-password" type="password" name="password" placeholder="/*[|template_placeholder|]*/0" autofocus />
                    </div>

                    <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" />
                        /*[|template_remember|]*/0
                    </label>

                    <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
                </form>

                <div class="staticrypt-error" id="staticrypt-error" role="alert"></div>
            </div>
        </div>
    </div>

    <button class="theme-btn" id="theme-btn" type="button" aria-label="切换主题">☀</button>

    <script>
        // Filled in by staticrypt at build time; the template format is '/*[|variable_name|]*/0'.
        const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
        const templateError = "/*[|template_error|]*/0",
            isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
            staticryptConfig = /*[|staticrypt_config|]*/ 0;

        // Behavior knobs used by staticrypt's runtime.
        const templateConfig = {
            rememberExpirationKey: "staticrypt_expiration",
            rememberPassphraseKey: "staticrypt_passphrase",
            replaceHtmlCallback: null,
            clearLocalStorageCallback: null,
        };

        // init the staticrypt engine
        const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

        const loadingEl = document.getElementById('staticrypt_loading');
        const contentEl = document.getElementById('staticrypt_content');
        const passwordEl = document.getElementById('staticrypt-password');
        const errorEl = document.getElementById('staticrypt-error');

        // try to automatically decrypt on load if there is a saved password
        window.onload = async function () {
            const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
            if (isSuccessful) return;

            // hide loading screen, show the password prompt
            loadingEl.classList.add('hidden');
            contentEl.classList.remove('hidden');
            passwordEl.focus();

            if (isRememberEnabled) {
                document.getElementById('staticrypt-remember-label').classList.remove('hidden');
            }
        };

        // handle password form submission
        document.getElementById('staticrypt-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            errorEl.textContent = '';

            const password = passwordEl.value;
            const isRememberChecked = document.getElementById('staticrypt-remember').checked;

            const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

            if (!isSuccessful) {
                errorEl.textContent = templateError;
                passwordEl.select();
            }
        });

        // theme toggle
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☀';
        themeBtn.addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeBtn.textContent = next === 'dark' ? '☾' : '☀';
        });
    </script>
</body>
</html>
