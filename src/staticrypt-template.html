<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>机密文档 | Sage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/sage.svg" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/sage.css" />
  <style>
    .locked-page {
      width: min(100% - 48px, 440px);
      margin: var(--spacing-64) auto;
      padding: var(--spacing-24);
      border: 1px solid var(--color-hairline);
      border-radius: var(--radius);
      background: var(--color-page);
    }
    .locked-page p { margin-top: var(--spacing-8); color: var(--color-muted); }
    .password-form { margin-top: var(--spacing-24); }
    .password-form > label:first-child { display: block; font-weight: 500; }
    .password-form .inline-input {
      display: block;
      width: 100%;
      margin-block: var(--spacing-4) var(--spacing-12);
      border-bottom-color: color-mix(in srgb, var(--color-hairline) 65%, transparent);
      font-size: var(--text-body-lg);
    }
    .password-form .inline-input:focus {
      border-bottom-color: var(--color-hairline);
    }
    .remember-option:not([hidden]) {
      display: flex;
      align-items: center;
      gap: var(--spacing-8);
      margin-bottom: var(--spacing-12);
    }
    .password-form .ghost-button {
      background: var(--color-hover-grey);
    }
    .password-form .ghost-button:hover,
    .password-form .ghost-button:active { background: var(--color-active); }
    .password-form .form-error { color: var(--color-error-text); }
    .locked-page .form-error:empty, .locked-page .form-status:empty { margin: 0; }
    @media (max-width: 768px) {
      .locked-page { margin-top: var(--spacing-32); }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header-start">
      <a class="site-brand ghost-button" href="/"><img src="/sage.svg" alt="" width="24" height="24" /> Sage</a>
      <span class="site-context">机密文档</span>
    </div>
    <button class="ghost-button" data-theme-toggle type="button" aria-label="暗色模式" aria-pressed="false">
      <span class="theme-icon-sun" aria-hidden="true">☀</span>
      <span class="theme-icon-moon" aria-hidden="true">☾</span>
    </button>
  </header>

  <main class="locked-page">
    <h1>机密文档</h1>
    <p>此文档受密码保护。</p>
    <p id="load-status" class="form-status" role="status"></p>
    <noscript><p>启用 JavaScript 后即可输入密码并解密文档。</p></noscript>

    <form id="staticrypt-form" class="password-form" method="post" hidden>
      <label for="staticrypt-password">密码</label>
      <input class="inline-input" id="staticrypt-password" type="password" name="password" required />
      <label id="staticrypt-remember-label" class="remember-option" hidden>
        <input id="staticrypt-remember" type="checkbox" />
        在此浏览器记住密码
      </label>
      <button id="submit-password" class="ghost-button" type="submit">解密</button>
      <p id="form-status" class="form-status" role="status"></p>
      <p id="staticrypt-error" class="form-error" role="alert"></p>
    </form>
  </main>

  <script>
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const staticryptConfig = /*[|staticrypt_config|]*/ 0;
    const isRememberEnabled = /*[|is_remember_enabled|]*/ 0;

    const staticrypt = staticryptInitiator.init(staticryptConfig, {
      rememberExpirationKey: 'staticrypt_expiration',
      rememberPassphraseKey: 'staticrypt_passphrase',
    });

    const form = document.getElementById('staticrypt-form');
    const loading = document.getElementById('load-status');
    const password = document.getElementById('staticrypt-password');
    const remember = document.getElementById('staticrypt-remember');
    const submit = document.getElementById('submit-password');
    const status = document.getElementById('form-status');
    const error = document.getElementById('staticrypt-error');

    async function showPasswordForm() {
      loading.textContent = '正在检查解锁状态…';
      if (!window.crypto?.subtle) {
        loading.textContent = '请通过 HTTPS 或 localhost 打开此页面。';
        return;
      }

      let storageAvailable = false;
      try {
        window.localStorage.getItem('staticrypt_expiration');
        storageAvailable = true;
        const result = await staticrypt.handleDecryptOnLoad();
        if (result.isSuccessful) return;
      } catch {
        // A failed automatic unlock still allows entering the password.
      }

      loading.hidden = true;
      form.hidden = false;
      document.getElementById('staticrypt-remember-label').hidden = !isRememberEnabled || !storageAvailable;
      password.focus();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (submit.disabled) return;
      error.textContent = '';
      status.textContent = '正在解密…';
      submit.disabled = true;

      try {
        const result = await staticrypt.handleDecryptionOfPage(password.value, remember.checked);
        if (!result.isSuccessful) {
          error.textContent = '密码错误，请重试。';
          password.focus();
          password.select();
        }
      } catch {
        error.textContent = '无法解密文档，请重试。';
      } finally {
        status.textContent = '';
        submit.disabled = false;
      }
    });

    showPasswordForm();
  </script>
</body>
</html>
